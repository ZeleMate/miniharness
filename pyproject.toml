[project]
name = "miniharness"
version = "0.1.0"
description = "A tiny agent harness built from scratch to learn design patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "openai>=2.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miniharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
