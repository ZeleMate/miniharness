# Installs the pinned uv (checksum-verified) and the Python it's asked for.
# Every job's tools come from a lockfile with hashes, so this is the only installer.
name: Set up uv
description: Install the pinned, checksum-verified uv and a uv-managed Python.
inputs:
  python-version:
    description: Python to use; empty means .python-version.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        # Bump both together; the digest is the release's
        # uv-x86_64-unknown-linux-gnu.tar.gz.sha256.
        version: "0.13.1"
        checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
        python-version: ${{ inputs.python-version }}
        # Keyed on uv.lock. Only pull_request and push to main run here, nothing
        # publishes, so a poisoned cache has nothing to reach.
        enable-cache: true
