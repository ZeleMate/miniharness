version: 2
updates:
  # Copier for template-update.yml (.github/tools/uv.lock), locked apart from the app.
  - package-ecosystem: uv
    directory: /.github/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
    # semgrep==1.181.0 pins these (opentelemetry-* ~=1.37.0 / ~=0.58b0, mcp==1.29.0), so no
    # update resolves and every security job fails. Their CVEs are accepted in ci-local.yml's
    # CI-tools audit (DECISIONS.md D226, D227). A Semgrep bump re-locks them; drop this then.
    ignore:
      - dependency-name: "opentelemetry-*"
      - dependency-name: "mcp"
    commit-message:
      prefix: ci

  - package-ecosystem: github-actions
    # The root covers .github/workflows; the composite actions are listed too.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # Third-party actions wait 7 days. The central workflows are our own, so they don't.
    cooldown:
      default-days: 7
      exclude: ["ZeleMate/workflows*"]
    groups:
      # Apart from `actions`, so a red central bump doesn't block unrelated updates.
      central-workflows:
        patterns: ["ZeleMate/workflows*"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["ZeleMate/workflows*"]
    ignore:
      # A major central release needs caller edits, so it arrives with a template update.
      - dependency-name: "ZeleMate/workflows*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
